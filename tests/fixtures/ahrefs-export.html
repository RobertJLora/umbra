<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Organic keywords - example.com | Ahrefs fixture</title>
    <style>
      body { font: 14px/1.4 sans-serif; margin: 24px; }
      .toolbar { display: flex; gap: 12px; margin-bottom: 24px; }
      button { padding: 8px 14px; }
      .chart-export { margin-top: 280px; }
      dialog { border: 1px solid #333; padding: 24px; width: 420px; }
      label { display: block; margin: 8px 0; }
    </style>
  </head>
  <body>
    <h1>Organic keywords</h1>
    <div class="toolbar">
      <button id="columns">Columns</button>
      <button id="toolbar-export">Export</button>
    </div>
    <p>All 12 keywords matching the current filters.</p>
    <div class="chart-export">
      <h2>Traffic chart</h2>
      <button id="chart-export">Export</button>
    </div>
    <dialog id="export-modal">
      <form method="dialog">
        <label><input type="radio" name="format" value="utf8" /> CSV (UTF-8)</label>
        <label><input type="radio" name="format" value="sheets" /> Google Sheets</label>
        <label><input type="radio" name="rows" value="all" /> All 12</label>
        <button id="modal-export" value="export">Export</button>
      </form>
    </dialog>
    <pre id="log"></pre>
    <script>
      window.__clicks = [];
      const log = (name) => {
        window.__clicks.push(name);
        document.getElementById('log').textContent = window.__clicks.join(',');
      };
      document.getElementById('toolbar-export').addEventListener('click', () => {
        log('toolbar-export');
        const dialog = document.getElementById('export-modal');
        if (dialog.open) dialog.close();
        else dialog.showModal();
      });
      document.getElementById('chart-export').addEventListener('click', () => log('chart-export'));
      document.getElementById('modal-export').addEventListener('click', () => log('modal-export'));
    </script>
  </body>
</html>
