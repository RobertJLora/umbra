[package]
name = "umbra-rust-broker"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Opt-in Tokio broker scaffold for umbra"
publish = false

[lib]
name = "umbra_rust_broker"
path = "src/lib.rs"

[[bin]]
name = "umbra-rust-broker"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
