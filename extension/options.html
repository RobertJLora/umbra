<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Umbra Settings</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #0f172a;
        background: radial-gradient(circle at top left, #eef2ff, #f8fafc 55%, #ffffff);
      }
      .shell {
        max-width: 760px;
        margin: 0 auto;
        display: grid;
        gap: 18px;
      }
      .card {
        background: rgba(255,255,255,0.92);
        border: 1px solid rgba(15,23,42,0.08);
        border-radius: 18px;
        padding: 20px 22px;
        box-shadow: 0 18px 48px rgba(15,23,42,0.08);
      }
      h1, h2 { margin: 0 0 10px; }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      label {
        display: grid;
        gap: 6px;
        font-weight: 600;
      }
      input[type="text"], input[type="password"], input[type="number"] {
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        padding: 10px 12px;
        font: inherit;
        background: #fff;
      }
      .actions {
        display: flex;
        gap: 12px;
        margin-top: 16px;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 10px 16px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button.primary { background: #1d4ed8; color: #fff; }
      button.secondary { background: #dbeafe; color: #1e293b; }
      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: #94a3b8;
      }
      .dot.on { background: #16a34a; }
      ul {
        margin: 10px 0 0;
        padding-left: 18px;
      }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <div class="shell">
      <section class="card">
        <h1>Umbra Settings</h1>
        <div class="status">
          <span id="status-dot" class="dot"></span>
          <span id="status-text">Loading status…</span>
        </div>
      </section>

      <section class="card">
        <h2>Connection</h2>
        <label>
          Shared Key
          <input id="sharedKey" type="password" autocomplete="off" />
        </label>
        <div class="grid">
          <label>
            Port Start
            <input id="portStart" type="number" min="1024" max="47852" />
          </label>
          <label>
            Port End
            <input id="portEnd" type="number" min="1024" max="47852" />
          </label>
        </div>
        <label style="margin-top:12px;">
          <span><input id="bridgeEnabled" type="checkbox" /> Enable loopback scanning</span>
        </label>
        <div class="actions">
          <button id="saveButton" class="primary">Save And Reconnect</button>
          <button id="reconnectButton" class="secondary">Reconnect Bridge</button>
          <button id="reloadButton" class="secondary">Reload Extension</button>
          <button id="refreshButton" class="secondary">Refresh Status</button>
        </div>
      </section>

      <section class="card">
        <h2>Session Status</h2>
        <ul id="sessionsList"></ul>
      </section>

      <section class="card">
        <h2>Bridge Debug</h2>
        <pre id="debugBox" style="white-space:pre-wrap; margin:0;"></pre>
      </section>

      <section class="card">
        <h2>Expected Test Values</h2>
        <p>For the current local smoke test, use port range <code>47821-47852</code>.</p>
      </section>
    </div>
    <script type="module" src="options.js"></script>
  </body>
</html>
