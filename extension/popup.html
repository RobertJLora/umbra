<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Umbra</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        width: 360px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #0f172a;
        background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
      }

      h1, h2 {
        margin: 0 0 10px;
        font-size: 14px;
      }

      .panel {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 12px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      }

      .row {
        display: grid;
        gap: 6px;
        margin-bottom: 10px;
      }

      .inline {
        display: grid;
        gap: 8px;
        grid-template-columns: 1fr 1fr;
      }

      label {
        font-weight: 600;
        font-size: 12px;
      }

      input[type="text"],
      input[type="password"],
      input[type="number"] {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 8px 10px;
        box-sizing: border-box;
        background: #fff;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #94a3b8;
      }

      .dot.on {
        background: #16a34a;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 9px 12px;
        font-weight: 600;
        cursor: pointer;
      }

      button.primary {
        color: #fff;
        background: #1d4ed8;
      }

      button.secondary {
        color: #1e293b;
        background: #dbeafe;
      }

      ul {
        margin: 0;
        padding-left: 18px;
      }

      .muted {
        color: #475569;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Umbra</h1>
      <div class="status">
        <span id="status-dot" class="dot"></span>
        <span id="status-text" class="muted">Loading status...</span>
      </div>
    </div>

    <div class="panel">
      <h2>Connection</h2>
      <div class="row">
        <label for="sharedKey">Shared Key</label>
        <input id="sharedKey" type="password" autocomplete="off" placeholder="Paste the shared install key" />
      </div>
      <div class="inline">
        <div class="row">
          <label for="portStart">Port Start</label>
          <input id="portStart" type="number" min="1024" max="47852" />
        </div>
        <div class="row">
          <label for="portEnd">Port End</label>
          <input id="portEnd" type="number" min="1024" max="47852" />
        </div>
      </div>
      <div class="row">
        <label>
          <input id="bridgeEnabled" type="checkbox" />
          Enable loopback session scanning
        </label>
      </div>
      <div class="inline">
        <button id="saveButton" class="primary">Save And Reconnect</button>
        <button id="refreshButton" class="secondary">Refresh Status</button>
      </div>
    </div>

    <div class="panel">
      <h2>Active Sessions</h2>
      <ul id="sessionsList" class="muted"></ul>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
